# Folder-wide Manim config, picked up when manim runs from the repo root (the
# Makefile always does). Final videos/stills land in the --media_dir the
# Makefile passes (renders/<subject>); every cache goes to build/.
[CLI]
notify_outdated_version = False
media_dir = renders
video_dir = {media_dir}/{module_name}/{quality}
images_dir = {media_dir}/{module_name}/{quality}
sections_dir = {video_dir}/sections
partial_movie_dir = build/partial_movie_files/{module_name}/{quality}/{scene_name}
tex_dir = build/Tex
text_dir = build/texts
log_dir = build/logs
